[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual-word-similarity-api"
version = "1.0.0"
description = "FastAPI service for comparing a word's meaning across two sentences"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "sentence-transformers>=3.3,<6",
    "spacy>=3.8,<4",
    "spacy-lookups-data>=1.0,<2",
    "transformers>=4.41,<5",
    "wtpsplit>=2.2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
